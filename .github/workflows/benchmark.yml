name: Benchmark

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # actions/checkout@v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify benchmark fixtures match generator
        run: node benchmark/build-fixtures.mjs --check

      - name: Run the labeled precision/recall benchmark
        run: npm run benchmark

      - name: Verify RESULTS.md is up to date (run `npm run benchmark && git add benchmark/RESULTS.md` if this fails)
        run: git diff --exit-code -- benchmark/RESULTS.md

      - name: Publish benchmark report to the run summary
        if: always()
        run: cat benchmark/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
