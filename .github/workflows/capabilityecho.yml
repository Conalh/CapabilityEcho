name: CapabilityEcho

on:
  pull_request:

permissions:
  contents: read

jobs:
  capability-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      # Deliberately run the trusted public baseline against PR diffs; CI
      # separately smoke-tests this branch's candidate bundle in ci.yml.
      - uses: Conalh/CapabilityEcho@main
        with:
          fail-on: none
