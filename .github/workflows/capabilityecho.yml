name: CapabilityEcho

on:
  pull_request:

permissions:
  contents: read

jobs:
  capability-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Deliberately run the trusted public baseline against PR diffs; CI
      # separately smoke-tests this branch's candidate bundle in ci.yml.
      - uses: Conalh/CapabilityEcho@main
        with:
          fail-on: none
