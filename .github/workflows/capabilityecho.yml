name: CapabilityEcho

on:
  pull_request:

permissions:
  contents: read

jobs:
  capability-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # actions/checkout@v6
        with:
          fetch-depth: 0

      # Deliberately run the trusted public baseline against PR diffs; CI
      # separately smoke-tests this branch's candidate bundle in ci.yml.
      - uses: Conalh/CapabilityEcho@main
        with:
          fail-on: none
