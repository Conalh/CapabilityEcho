name: ScopeTrail

on:
  pull_request:

permissions:
  contents: read

jobs:
  permission-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - uses: Conalh/ScopeTrail@b19aa2902239fea74308a18a8d7d93b013f580de # Conalh/ScopeTrail@v0.4.0
        with:
          fail-on: none
