name: ScopeTrail

on:
  pull_request:

permissions:
  contents: read

jobs:
  permission-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: Conalh/ScopeTrail@b19aa2902239fea74308a18a8d7d93b013f580de # Conalh/ScopeTrail@v0.4.0
        with:
          fail-on: none
