name: ScopeTrail

on:
  pull_request:

permissions:
  contents: read

jobs:
  permission-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: Conalh/ScopeTrail@d5f3be07b5942adab5dc8b33f8cf40d746e7cc47 # Conalh/ScopeTrail@v0.1.11
        with:
          fail-on: none
