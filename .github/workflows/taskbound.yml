name: TaskBound

on:
  pull_request:

permissions:
  contents: read

jobs:
  scope-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - uses: Conalh/TaskBound@baf66e316f6fb0a248e1c2abf879bc061ac0fc23 # Conalh/TaskBound@v0.2.3
        with:
          fail-on: none
