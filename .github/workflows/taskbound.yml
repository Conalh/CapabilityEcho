name: TaskBound

on:
  pull_request:

permissions:
  contents: read

jobs:
  scope-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: Conalh/TaskBound@baf66e316f6fb0a248e1c2abf879bc061ac0fc23 # Conalh/TaskBound@v0.2.3
        with:
          fail-on: none
