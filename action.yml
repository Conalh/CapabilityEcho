name: CapabilityEcho
description: Code review for AI agent capability drift in pull requests.
author: Conal

branding:
  icon: radar
  color: blue

inputs:
  repo:
    description: Repository checkout path to inspect. Defaults to GITHUB_WORKSPACE.
    required: false
    default: ''
  base:
    description: Base git ref or SHA to compare from. Defaults to the pull request base SHA when available.
    required: false
    default: ''
  head:
    description: Head git ref or SHA to compare to. Defaults to the pull request head SHA when available.
    required: false
    default: ''
  fail-on:
    description: Severity that fails the action. Use none, low, medium, high, or critical. Case-insensitive.
    required: false
    default: none
  max-findings:
    description: |
      If > 0, truncates the on-action markdown/json outputs and the step summary to the top-N findings ranked by severity. The full finding count, surface summary, rating, and fail-on decision are still computed against the complete set. 0 disables truncation. Use with report-file when you want both a short PR view and a full artifact.
    required: false
    default: '0'
  max-output-bytes:
    description: |
      If > 0, suppresses the report-markdown and report-json action outputs (only — not the step summary) when they exceed this byte size, replacing them with a short notice. 0 disables. Useful to stay inside GitHub Action output limits on very large PRs.
    required: false
    default: '0'
  report-file:
    description: |
      Optional path (absolute or repo-relative) to write the full markdown report. A sibling `<path>.json` is also written. Truncation never applies to the sidecar files, so pair this with `actions/upload-artifact` to keep a complete record alongside a truncated PR view.
    required: false
    default: ''

outputs:
  rating:
    description: Highest CapabilityEcho capability drift rating.
  has-findings:
    description: Whether CapabilityEcho found at least one capability drift finding.
  finding-count:
    description: Total CapabilityEcho findings in the diff.
  changed-file-count:
    description: Number of changed scannable files in the diff.
  surface-summary:
    description: JSON object with finding counts by executable surface.
  severity-summary:
    description: JSON object with finding counts by severity.
  capability-summary:
    description: JSON array of human-readable capability signal labels found in the diff.
  top-recommendations:
    description: JSON array of the highest-priority recommendations for the diff.
  adoption-evidence:
    description: Redacted JSON rollup for sharing in team feedback; excludes file paths and raw findings.
  report-markdown:
    description: Full Markdown CapabilityEcho report, suitable for PR comments or downstream archival.
  report-json:
    description: Full JSON CapabilityEcho report, suitable for local artifacts, dashboards, or downstream policy tooling.

runs:
  using: node24
  main: dist/action-bundle/index.js
