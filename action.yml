name: CapabilityEcho
description: Code review for AI agent capability drift in pull requests.
author: Conal

branding:
  icon: radar
  color: blue

inputs:
  repo:
    description: Repository checkout path to inspect. Defaults to GITHUB_WORKSPACE.
    required: false
    default: ''
  base:
    description: Base git ref or SHA to compare from. Defaults to the pull request base SHA when available.
    required: false
    default: ''
  head:
    description: Head git ref or SHA to compare to. Defaults to the pull request head SHA when available.
    required: false
    default: ''
  fail-on:
    description: Severity that fails the action. Use none, low, medium, high, or critical.
    required: false
    default: none

outputs:
  rating:
    description: Highest CapabilityEcho capability drift rating.
  finding-count:
    description: Total CapabilityEcho findings in the diff.
  changed-file-count:
    description: Number of changed scannable files in the diff.

runs:
  using: node24
  main: dist/action.js
