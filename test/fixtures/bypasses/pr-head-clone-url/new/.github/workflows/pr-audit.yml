name: PR Audit

on:
  pull_request_target:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build head
        run: |
          git clone ${{ github.event.pull_request.head.repo.clone_url }} pr
          cd pr
          git fetch origin refs/pull/${{ github.event.pull_request.number }}/merge
          git checkout FETCH_HEAD
